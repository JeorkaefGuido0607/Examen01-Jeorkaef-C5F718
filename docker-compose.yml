services:
    jggdb:
        image: mysql:9.7
        container_name: jggdb
        environment:
            MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
            MYSQL_DATABASE: db_salon
        ports:
            - 3307:3306
        volumes:
            - ./db_dump:/docker-entrypoint-initdb.d
            - mysql_data:/var/lib/mysql
        secrets:
            - db_password

    jggdatos:
        container_name: jggdatos
        volumes:
            - ./Data/public:/var/www/html/public
            - ./Data/src:/var/www/html/src
        build:
            context: .
            dockerfile: ./Data/Dockerfile
        ports:
            - 8080:80
        depends_on:
            - jggdb

    jggnegocio:
        container_name: jggnegocio
        volumes:
            - ./Business/public:/var/www/html/public
            - ./Business/src:/var/www/html/src
        build:
            context: .
            dockerfile: ./Business/Dockerfile
        ports:
            - 9090:80
        depends_on:
            - jggdatos

secrets:
    db_password:
        file: ./db_password.txt

volumes:
    mysql_data:
